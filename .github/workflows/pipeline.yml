name: CI/CD ShopSphere

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, linux, debian-624]
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas del backend (Maven en contenedor)
        run: |
          docker run --rm \
            -v "$PWD/Ecommerce-Backend:/src:ro" \
            -v m2-cache:/root/.m2 \
            maven:3.9-eclipse-temurin-21 \
            sh -c "cp -r /src /app && cd /app && mvn -B test"

  build:
    needs: test
    runs-on: [self-hosted, linux, debian-624]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes Docker
        run: docker compose build

  deploy:
    needs: build
    runs-on: [self-hosted, linux, debian-624]
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar contenedores
        run: docker compose up -d
