spring.application.name=ecom-proj

spring.datasource.url=${DB_URL:jdbc:h2:mem:ecommerce;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.data-locations=classpath:data1.sql

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
